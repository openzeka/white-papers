about_report: |-
  ## Over ons — Openzeka

  **Openzeka Teknoloji A.Ş.**, opgericht in 2016 in Ankara Bilkent Cyberpark, is de **officiële Embedded Compute-distributeur van NVIDIA in de regio Türkiye en MEA** en een **NVIDIA Elite Partner**. Het bedrijf distribueert NVIDIA **DGX/HGX**-servers, datacenter- en professionele GPU's, **Jetson** embedded systemen en werkstations voor kunstmatige intelligentie en high-performance computing, en biedt met zijn zelfontwikkelde **Cordatus AI**-platform oplossingen voor realtime videoanalyse en AI-inferentie in edge- en cloudomgevingen. Met zijn expertise in op deep learning gebaseerde kunstmatige intelligentie, digital twins en digitale transformatie is het een van de toonaangevende aanbieders van embedded AI in zijn regio.

