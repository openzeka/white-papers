about_profile: |-
  #### Over OpenZeka

  ![OpenZeka](/papers/yerel-llm-rehberi/images/openzeka-logo.png)

  **OpenZeka Teknoloji A.Ş.** is in 2016 opgericht in Ankara Bilkent Cyberpark en biedt innovatieve AI-oplossingen in hardware en software. Het is de **officiële NVIDIA Robotics-distributeur voor Turkije en MEA (MENA)**; daarnaast is het **NVIDIA DGX AI Compute Systems**- en **NVIDIA Omniverse Partner**, en **Elite Partner** op het gebied van NVIDIA Visualization.

  - **Hardware:** DGX/HGX-serveroplossingen, professionele grafische kaarten en werkstations, NVIDIA Jetson embedded systemen (developer kits, kant-en-klare AI-kits, modules en carrier boards). Wij ontwerpen en implementeren volledig redundante AI-infrastructuur die compute, opslag, netwerken en orkestratie omvat.
  - **Software:** Met ons eigen **Cordatus AI**-platform leveren wij branchespecifieke oplossingen, vooral op het gebied van intelligente videoanalyse.
  - **Digitale transformatie:** Wij lopen voorop in digitale transformatie met NVIDIA Omniverse- en Digital Twin-technologieën; wij delen onze kennis op evenementen zoals NVIDIA GTC, Embedded World en Smart City Expo, via samenwerkingen met universiteiten en AI Workshops.

