# Company identity — Dutch.
#
# Every company-specific block a paper shows — the "Prepared by" line, the
# contact footer, the "About us" section, the closing call to action and the
# product purchase buttons — is kept here, not in the paper. A paper places a
# block with
#   {% include company/block.html name="<key>" %}
# and a purchase button with
#   {% include company/product-button.html product="<key>" %}
# so the paper itself holds only paper content. Change a company detail once,
# here, in every language file under _data/<lang>/company.yml.
#
# Blocks are Markdown, inserted before the page is converted. Links and image
# paths are written out literally: Liquid inside these values is not run.
# A key used by a paper must exist in that paper's language; the paper checker
# (_tools/check_papers.py) verifies it.

