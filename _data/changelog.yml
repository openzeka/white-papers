- date: 2026-09-29
  type: paper
  page: conditional-memory-offloading
  text:
    en: "Engram tables are large but read only a few rows per token, so they can move from GPU memory to host RAM or NVMe. What that means on DGX Spark, RTX PRO 6000 and DGX B300, and measured results with DeepSeek-V4.1-Flash and Qwen3.8-Flash-Next."
    tr: "Engram tabloları büyüktür, ancak her token için yalnızca birkaç satırı okunur; bu nedenle GPU belleğinden sistem RAM'ine veya NVMe'ye taşınabilirler. Bunun DGX Spark, RTX PRO 6000 ve DGX B300 için anlamı ve DeepSeek-V4.1-Flash ile Qwen3.8-Flash-Next ölçüm sonuçları."
    nl: "Engram-tabellen zijn groot, maar per token worden er maar een paar rijen uit gelezen; daarom kunnen ze van het GPU-geheugen naar systeem-RAM of NVMe. Wat dat betekent op DGX Spark, RTX PRO 6000 en DGX B300, en meetresultaten met DeepSeek-V4.1-Flash en Qwen3.8-Flash-Next."

