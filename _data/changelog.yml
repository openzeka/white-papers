# What is new on the site, for readers — the /changelog/ page and the
# "Latest changes" block on the home page (_includes/changelog.html; links
# resolved by _plugins/changelog.rb). Newest first; entries on the same day
# keep this file's order.
#
# One entry per addition — four kinds only:
#   paper       a new white paper            page: <page_id>
#   benchmarks  a new LLM benchmark run      run:  <run id in assets/data/llm-benchmarks/>
#   vlm         a new VLM benchmark run      vlm:  <run id in assets/data/vlm-benchmarks/>
#   cv          a new CV benchmark result    cv:   <device>-<model> (the store's file path)
# Every entry has `date` (YYYY-MM-DD, the day it went live) and one sentence
# of `text` in en, tr and nl. The link (title and URL in the reader's
# language) comes from page/run/cv. Not in the changelog: paper revisions,
# site features, fixes and corrections, renames, tooling. Running text names no company.
# Check with: python3 _tools/check_changelog.py

