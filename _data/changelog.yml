- date: 2026-10-21
  type: paper
  page: kv-cache-offloading-lmcache
  text:
    en: "What LMCache adds to vLLM when the same contexts come back: a three-tier KV cache (GPU, CPU, NVMe) on DGX Spark, measured TTFT — 1.95× on repeated access, 3.3× after a service restart — and the settings and limits that come with it."
    tr: "Aynı bağlamların geri geldiği iş yükünde LMCache'in vLLM'e kattığı değer: DGX Spark'te üç katmanlı KV cache (GPU, CPU, NVMe), ölçülen TTFT — tekrar erişimde 1.95×, servis yeniden başlatmasında 3.3× — ve bununla birlikte gelen ayarlar ve sınırlar."
    nl: "Wat LMCache aan vLLM toevoegt wanneer dezelfde contexten terugkomen: een drietraps KV-cache (GPU, CPU, NVMe) op DGX Spark, gemeten TTFT — 1.95× bij hergebruik, 3.3× na een herstart van de service — en de instellingen en grenzen die daarbij horen."

- date: 2026-10-15
  type: paper
  page: dgx-spark-link-speed-tensor-parallel
  text:
    en: "How much network bandwidth an 8-Spark tensor-parallel cluster really uses, and what running each DGX Spark at 100G instead of 200G costs: the mechanism, an estimate from the model's architecture, and measurements with GLM-5.3 at TP8."
    tr: "8 Spark'lık bir tensör paralel cluster'ın ağ bant genişliğini gerçekte ne kadar kullandığı ve her DGX Spark'ı 200G yerine 100G ile çalıştırmanın neye mal olduğu: mekanizma, modelin mimarisinden yapılan tahmin ve GLM-5.3 ile TP8'de yapılan ölçümler."
    nl: "Hoeveel netwerkbandbreedte een tensorparallel cluster van 8 Sparks werkelijk gebruikt, en wat het kost om elke DGX Spark op 100G in plaats van 200G te laten draaien: het mechanisme, een schatting op basis van de architectuur van het model, en metingen met GLM-5.3 op TP8."

